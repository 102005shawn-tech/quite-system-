<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>You need to 嘴巴閉閉 - Quiet System</title>
  <style>
    :root {
      --bg-main: #0b1118;
      --bg-card: #131c26;
      --bg-card-sub: #1a2533;
      --border: #233345;
      --text-main: #e2e8f0;
      --text-muted: #8395a7;
      --accent-teal: #10b981;
      --accent-warn: #f43f5e;
      --accent-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 頂部導航列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 14px 20px;
      border-radius: 14px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
    }

    .status-dot.active {
      background: var(--accent-teal);
      box-shadow: 0 0 10px var(--accent-teal);
    }

    .title-group p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      background: var(--bg-card-sub);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button.btn-primary {
      background: var(--accent-teal);
      color: #042f2e;
      border: none;
      font-weight: 700;
    }

    button.btn-danger {
      background: var(--accent-warn);
      color: #fff;
      border: none;
    }

    /* 上方狀態區（草稿對照） */
    .top-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .top-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* 即時聲量 */
    .db-value-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 10px 0;
    }

    .db-number {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }

    .db-unit {
      font-size: 1.4rem;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--bg-card-sub);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-teal);
      transition: width 0.08s linear, background-color 0.2s ease;
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* 狀態提示卡片 */
    .status-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .status-card.alert {
      border-color: var(--accent-warn);
      background: rgba(244, 63, 94, 0.08);
      animation: alert-pulse 1.2s infinite alternate;
    }

    @keyframes alert-pulse {
      0% { box-shadow: 0 0 0px transparent; }
      100% { box-shadow: 0 0 20px rgba(244, 63, 94, 0.3); }
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--accent-teal);
    }

    .status-card.alert .badge-status {
      color: var(--accent-warn);
    }

    .status-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 聲波圖 Canvas 區域 */
    .wave-card {
      display: flex;
      flex-direction: column;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 240px;
      background: #090e14;
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 下方設定與事件紀錄 */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .bottom-grid {
        grid-template-columns: 1fr;
      }
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .control-item label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    /* 事件紀錄清單 */
    .log-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .log-list::-webkit-scrollbar {
      width: 4px;
    }
    .log-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .log-item {
      font-size: 0.8rem;
      padding: 6px 10px;
      background: var(--bg-card-sub);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #64748b;
    }

    .log-item.warn {
      border-left-color: var(--accent-warn);
      color: #fda4af;
    }

    .log-item.ok {
      border-left-color: var(--accent-teal);
      color: #86efac;
    }

    /* 首次進入的授權彈窗 (Modal) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 28px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-box h2 {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #fff;
    }

    .modal-box p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .modal-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--accent-teal);
      color: #064e3b;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 啟動授權彈窗 -->
  <div class="modal-overlay" id="permModal">
    <div class="modal-box">
      <h2 id="mTitle">🎤 開啟環境音量偵測</h2>
      <p id="mDesc">本系統需使用麥克風偵測環境分貝，所有聲音運算皆在本地設備完成，絕不上傳任何音訊隱私。請點擊下方按鈕以啟用。</p>
      <button class="modal-btn" id="btnModalStart">允許並開始偵測</button>
    </div>
  </div>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="title-group">
        <h1>
          <span class="status-dot" id="micDot"></span>
          <span id="txtAppTitle">環境音量偵測與智慧提醒系統</span>
        </h1>
        <p>You need to 嘴巴閉閉 (Quiet System)</p>
      </div>
      <div class="header-actions">
        <button id="btnToggleMic">啟用麥克風</button>
        <button id="btnLang">English</button>
      </div>
    </header>

    <!-- Top Grid (即時聲量 + 狀態告示) -->
    <div class="top-grid">
      <div class="card">
        <div class="card-title">
          <span id="txtRealtime">即時聲量</span>
          <span id="txtModeTag" style="color: var(--accent-blue)">未連線</span>
        </div>
        <div class="db-value-box">
          <div class="db-number" id="dbDisplay">0</div>
          <div class="db-unit">dB</div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="dbBar"></div>
        </div>
        <div class="scale-labels">
          <span>0 dB (極靜)</span>
          <span id="txtThresholdMark">門檻: 65 dB</span>
          <span>100 dB</span>
        </div>
      </div>

      <div class="card status-card" id="statusCard">
        <div class="badge-status" id="statusBadge">正常</div>
        <div class="status-desc" id="statusDesc">目前環境音量良好，請保持安靜專注。</div>
      </div>
    </div>

    <!-- 近 40 秒聲波圖 -->
    <div class="card wave-card">
      <div class="card-title">
        <span id="txtWaveTitle">近 40 秒聲波圖</span>
        <span id="txtWaveSub">紅虛線為提醒門檻</span>
      </div>
      <div class="canvas-wrapper">
        <canvas id="waveCanvas"></canvas>
      </div>
    </div>

    <!-- Bottom Grid (靈敏度設定 + 事件紀錄) -->
    <div class="bottom-grid">
      <!-- 靈敏度與門檻設定 -->
      <div class="card">
        <div class="card-title" id="txtSettingTitle">門檻與靈敏度設定</div>
        
        <div class="control-item">
          <label>
            <span id="txtThreshLabel">警示門檻 (Threshold)</span>
            <span id="valThresh" style="color: var(--accent-warn); font-weight: bold;">65 dB</span>
          </label>
          <input type="range" id="inputThreshold" min="30" max="95" value="65" />
        </div>

        <div class="control-item">
          <label>
            <span id="txtTimeLabel">波形時間 (Time Window)</span>
            <span id="valTimeSpan" style="color: var(--accent-blue); font-weight: bold;">40 秒</span>
          </label>
          <input type="range" id="inputTimeSpan" min="20" max="60" step="10" value="40" />
        </div>

        <div class="control-item">
          <label>
            <span id="txtGainLabel">麥克風增益校正 (Mic Gain)</span>
            <span id="valGain">1.0x</span>
          </label>
          <input type="range" id="inputGain" min="0.5" max="3.0" step="0.1" value="1.0" />
        </div>
      </div>

      <!-- 事件紀錄 -->
      <div class="card">
        <div class="card-title">
          <span id="txtLogTitle">事件紀錄</span>
          <button id="btnClearLog" style="padding: 2px 8px; font-size: 0.75rem;">清除紀錄</button>
        </div>
        <div class="log-list" id="logList">
          <!-- 動態添加紀錄 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // 雙語字典
    const i18n = {
      zh: {
        appTitle: "環境音量偵測與智慧提醒系統",
        modalTitle: "🎤 開啟環境音量偵測",
        modalDesc: "本系統需使用麥克風偵測環境分貝，所有聲音運算皆在本地設備完成，絕不上傳任何音訊隱私。請點擊下方按鈕以啟用。",
        modalBtn: "允許並開始偵測",
        btnMicStart: "關閉麥克風",
        btnMicStop: "啟用麥克風",
        realtime: "即時聲量",
        connected: "偵測中",
        disconnected: "未連線",
        thresholdMark: "門檻: ",
        statusNormal: "正常",
        statusWarn: "請安靜！",
        descNormal: "目前環境音量良好，請保持安靜專注。",
        descWarn: "音量已超過警戒門檻，請降低談話音量！",
        waveTitle: "近 {sec} 秒聲波圖",
        waveSub: "紅虛線為提醒門檻",
        settingTitle: "門檻與靈敏度設定",
        threshLabel: "警示門檻 (Threshold)",
        timeLabel: "波形時間 (Time Window)",
        gainLabel: "麥克風增益校正 (Mic Gain)",
        logTitle: "事件紀錄",
        btnClear: "清除紀錄",
        logAlert: "觸發提醒 ({val} dB)",
        logRecover: "恢復安靜 ({val} dB)",
        errMic: "無法存取麥克風，請確認瀏覽器權限設定。"
      },
      en: {
        appTitle: "Ambient Noise Detection & Alert System",
        modalTitle: "🎤 Enable Sound Monitoring",
        modalDesc: "This system requires microphone access to measure real-time ambient decibels. All audio processing runs locally on your device.",
        modalBtn: "Allow & Start Monitoring",
        btnMicStart: "Stop Mic",
        btnMicStop: "Start Mic",
        realtime: "Real-time Noise",
        connected: "Listening",
        disconnected: "Disconnected",
        thresholdMark: "Threshold: ",
        statusNormal: "NORMAL",
        statusWarn: "QUIET PLEASE!",
        descNormal: "Ambient sound is well within comfortable limits.",
        descWarn: "Noise level exceeds the alert threshold! Please lower your voice.",
        waveTitle: "Last {sec}s Waveform",
        waveSub: "Dashed red line indicates alert threshold",
        settingTitle: "Sensitivity & Threshold Settings",
        threshLabel: "Alert Threshold",
        timeLabel: "Time Window",
        gainLabel: "Mic Calibration Gain",
        logTitle: "Event Log",
        btnClear: "Clear Logs",
        logAlert: "Triggered Alert ({val} dB)",
        logRecover: "Returned to Normal ({val} dB)",
        errMic: "Microphone access denied. Please grant permission in browser settings."
      }
    };

    let currentLang = "zh";
    let isListening = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let sourceNode = null;
    let animFrameId = null;

    let threshold = 65;
    let timeSpanSec = 40;
    let micGain = 1.0;
    let currentDb = 0;
    let wasExceeded = false;

    // 存放聲波數據點：{ time: timestamp, db: value }
    const waveHistory = [];

    // DOM 節點
    const canvas = document.getElementById("waveCanvas");
    const ctx = canvas.getContext("2d");
    const dbDisplay = document.getElementById("dbDisplay");
    const dbBar = document.getElementById("dbBar");
    const statusCard = document.getElementById("statusCard");
    const statusBadge = document.getElementById("statusBadge");
    const statusDesc = document.getElementById("statusDesc");
    const logList = document.getElementById("logList");
    const micDot = document.getElementById("micDot");
    const txtModeTag = document.getElementById("txtModeTag");
    const btnToggleMic = document.getElementById("btnToggleMic");
    const btnLang = document.getElementById("btnLang");
    const inputThreshold = document.getElementById("inputThreshold");
    const inputTimeSpan = document.getElementById("inputTimeSpan");
    const inputGain = document.getElementById("inputGain");
    const permModal = document.getElementById("permModal");

    // 初始化 Canvas 解析度
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // 啟動真實麥克風監聽
    async function startListening() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.3;

        sourceNode = audioCtx.createMediaStreamSource(micStream);
        sourceNode.connect(analyser);

        isListening = true;
        updateUIState(true);
        permModal.style.display = "none";

        processAudioLoop();
      } catch (err) {
        console.error(err);
        alert(i18n[currentLang].errMic);
        updateUIState(false);
      }
    }

    // 停止麥克風
    function stopListening() {
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
      }
      isListening = false;
      updateUIState(false);
    }

    // 核心音訊採樣與計算循環
    function processAudioLoop() {
      if (!isListening) return;

      const buffer = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(buffer);

      // 計算 RMS (均方根振幅)
      let sum = 0;
      for (let i = 0; i < buffer.length; i++) {
        const normalized = (buffer[i] - 128) / 128;
        sum += normalized * normalized;
      }
      const rms = Math.sqrt(sum / buffer.length);

      // 將 RMS 映射到約略可視化分貝值 (30dB ~ 100dB)
      let calculatedDb = 0;
      if (rms > 0.0001) {
        const rawDb = 20 * Math.log10(rms);
        calculatedDb = Math.round(95 + rawDb * 1.35 * micGain);
      }
      calculatedDb = Math.max(30, Math.min(100, calculatedDb));
      currentDb = calculatedDb;

      // 儲存時間軸數據
      const now = Date.now();
      waveHistory.push({ time: now, db: currentDb });

      // 移除超過設定時間長度（如 40 秒前）的舊資料
      const cutoffTime = now - (timeSpanSec * 1000);
      while (waveHistory.length > 0 && waveHistory[0].time < cutoffTime) {
        waveHistory.shift();
      }

      // 狀態更新判斷
      checkThresholdState();

      // 即時繪圖
      renderCanvas();

      animFrameId = requestAnimationFrame(processAudioLoop);
    }

    // 判定是否超標
    function checkThresholdState() {
      dbDisplay.textContent = currentDb;
      dbBar.style.width = `${currentDb}%`;

      const t = i18n[currentLang];
      const isOver = currentDb >= threshold;

      if (isOver) {
        statusCard.classList.add("alert");
        statusBadge.textContent = t.statusWarn;
        statusDesc.textContent = t.descWarn;
        dbBar.style.backgroundColor = "var(--accent-warn)";

        if (!wasExceeded) {
          wasExceeded = true;
          addLog(t.logAlert.replace("{val}", currentDb), true);
        }
      } else {
        statusCard.classList.remove("alert");
        statusBadge.textContent = t.statusNormal;
        statusDesc.textContent = t.descNormal;
        dbBar.style.backgroundColor = "var(--accent-teal)";

        if (wasExceeded) {
          wasExceeded = false;
          addLog(t.logRecover.replace("{val}", currentDb), false);
        }
      }
    }

    // 繪製聲波折線圖 (還原草圖樣式：-40, -30, -20, -10, now)
    function renderCanvas() {
      const w = canvas.parentElement.clientWidth;
      const h = canvas.parentElement.clientHeight;

      ctx.clearRect(0, 0, w, h);

      const paddingLeft = 50;
      const paddingBottom = 30;
      const plotW = w - paddingLeft - 20;
      const plotH = h - paddingBottom - 20;

      // 1. 繪製 Y 軸刻度 (20, 40, 60, 80, 100 dB)
      ctx.strokeStyle = "#1e293b";
      ctx.fillStyle = "#64748b";
      ctx.lineWidth = 1;
      ctx.font = "11px monospace";

      const yTicks = [20, 40, 60, 80, 100];
      yTicks.forEach(val => {
        const y = 20 + plotH - ((val - 20) / 80) * plotH;
        ctx.beginPath();
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(w - 20, y);
        ctx.stroke();
        ctx.fillText(`${val}`, 16, y + 4);
      });

      // 繪製 Y 軸單位標籤 "dB"
      ctx.fillStyle = "#94a3b8";
      ctx.fillText("dB", 20, 15);

      // 2. 繪製 X 軸刻度 (-40, -30, -20, -10, now)
      const now = Date.now();
      const step = timeSpanSec / 4;
      for (let i = 0; i <= 4; i++) {
        const x = paddingLeft + (i / 4) * plotW;
        ctx.beginPath();
        ctx.moveTo(x, 20);
        ctx.lineTo(x, 20 + plotH);
        ctx.strokeStyle = "#17202c";
        ctx.stroke();

        let label = "";
        if (i === 4) {
          label =
